# Checks every push, builds the web app, and (once hosting is switched on) deploys it.
#
# Deploying to GitHub Pages: the repo is private, so Pages needs a paid GitHub plan (or a public
# repo). Then: Settings → Pages → Source: "GitHub Actions", and Settings → Secrets and
# variables → Actions → Variables: DEPLOY_PAGES = true. Until then the deploy job is skipped.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (fmt, clippy, tests, wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # "Never break wasm": the engine must always build for the browser.
      - run: cargo check -p easycad-core -p easycad-wasm --target wasm32-unknown-unknown --locked
      # Licenses: permissive only, and the notices file must list every dependency.
      - run: python3 scripts/third-party-notices.py --check

  web:
    name: Web app (build, size budget, smoke test)
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli (same version as Cargo.lock)
        run: |
          v=$(cargo metadata --format-version 1 --locked | python3 -c "import sys, json; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name'] == 'wasm-bindgen'))")
          cargo install wasm-bindgen-cli --version "$v" --locked
      - run: scripts/build-web.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Smoke test in headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/smoke-test.cjs
      - uses: actions/upload-pages-artifact@v4
        if: vars.DEPLOY_PAGES == 'true'
        with:
          path: web

  deploy:
    name: Deploy to GitHub Pages
    if: vars.DEPLOY_PAGES == 'true' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
