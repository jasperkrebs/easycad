# Checks every push, builds the web app, and deploys it to GitHub Pages from the default branch.
#
# Hosting (decided 15 Oct 2026): the repo is public, so GitHub Pages is free. It needs one
# setting, once: Settings → Pages → Source: "GitHub Actions". Until then the deploy job only
# leaves a notice and stays green. After switching it on, Actions → CI → "Run workflow"
# deploys without waiting for the next push. A private repo needs a paid plan for Pages; then also set the
# repo variable DEPLOY_PAGES = true.
#
# The AI proxy (agent-proxy/, a Cloudflare Worker that keeps the Claude API key) is deployed
# from the default branch once four repository secrets exist: CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY and EASYCAD_PASSWORD (docs/api-key.md). Its address
# goes into the app's config.json, so the app finds it by itself. Without the secrets the job
# leaves a notice and stays green; the app's "key on this device" mode works either way.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (fmt, clippy, tests, wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # "Never break wasm": the engine must always build for the browser.
      - run: cargo check -p easycad-lang -p easycad-core -p easycad-wasm --target wasm32-unknown-unknown --locked
      # Licenses: permissive only, and the notices file must list every dependency.
      - run: python3 scripts/third-party-notices.py --check
      - run: python3 scripts/hand-checked-fixtures.py --check

  proxy:
    name: AI proxy (Cloudflare Worker)
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test agent-proxy/worker.test.mjs
      - name: Deploy (once the Cloudflare secrets are set)
        id: deploy
        working-directory: agent-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EASYCAD_PASSWORD: ${{ secrets.EASYCAD_PASSWORD }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::The AI proxy wasn't deployed: no Cloudflare secrets yet (docs/api-key.md). The app's 'key on this device' mode still works."
            exit 0
          fi
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$EASYCAD_PASSWORD" ]; then
            echo "::error::Add both ANTHROPIC_API_KEY and EASYCAD_PASSWORD as repository secrets (docs/api-key.md)."
            exit 1
          fi
          # Only this repo's GitHub Pages site (and a local server) may call the proxy.
          pages="https://$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]').github.io"
          sed -i "s|^ALLOWED_ORIGINS = .*|ALLOWED_ORIGINS = \"$pages,http://localhost:8080,http://127.0.0.1:8080\"|" wrangler.toml
          npx --yes wrangler@4.146.0 deploy | tee deploy.log
          printf '%s' "$ANTHROPIC_API_KEY" | npx --yes wrangler@4.146.0 secret put ANTHROPIC_API_KEY
          printf '%s' "$EASYCAD_PASSWORD" | npx --yes wrangler@4.146.0 secret put EASYCAD_PASSWORD
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::Deployed, but Wrangler printed no workers.dev address. Is a workers.dev subdomain set up (docs/api-key.md)?"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::The AI proxy is live at $url"

  web:
    name: Web app (build, size budget, smoke test)
    runs-on: ubuntu-latest
    needs: [engine, proxy]
    # The proxy job runs only on the default branch, and a broken proxy setup shouldn't stop the
    # website from updating: only the engine has to pass.
    if: ${{ !cancelled() && needs.engine.result == 'success' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli (same version as Cargo.lock)
        run: |
          v=$(cargo metadata --format-version 1 --locked | python3 -c "import sys, json; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name'] == 'wasm-bindgen'))")
          cargo install wasm-bindgen-cli --version "$v" --locked
      - run: scripts/build-web.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test agent-proxy/worker.test.mjs
      - name: Smoke test in headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/smoke-test.cjs
          node scripts/agent-test.cjs
          node scripts/graph-test.cjs
      - name: App config (the AI proxy's address, when it's deployed; the repo's copy is empty)
        env:
          AGENT_URL: ${{ needs.proxy.outputs.url }}
        run: |
          python3 -c "import json, os; json.dump({'agentUrl': os.environ.get('AGENT_URL', '')}, open('web/config.json', 'w'))"
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: web

  deploy:
    name: Deploy to GitHub Pages
    # Pushes deploy; so does "Run workflow" in the Actions tab (handy right after switching Pages on).
    if: >-
      needs.web.result == 'success' && !cancelled() &&
      github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch &&
      (!github.event.repository.private || vars.DEPLOY_PAGES == 'true')
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Is GitHub Pages switched on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is off, so nothing was deployed. Switch it on once: Settings → Pages → Source: GitHub Actions."
          fi
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
